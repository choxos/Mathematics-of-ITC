project:
  type: book
  output-dir: docs

book:
  title: "The Mathematics of Indirect Treatment Comparisons"
  subtitle: "Population Adjustment, Transportability, and Comparative Effect Estimation"
  author: "Ahmad Sofi-Mahmudi"
  date: today
  search: true
  site-url: https://choxos.github.io/Mathematics-of-ITC/
  repo-url: https://github.com/choxos/Mathematics-of-ITC
  chapters:
    - index.qmd
    - notation.qmd
    - part: "Part I: Mathematical Foundations"
      chapters:
        - chapters/part1/01-linear-algebra-i.qmd
        - chapters/part1/02-linear-algebra-ii.qmd
        - chapters/part1/03-linear-algebra-iii.qmd
        - chapters/part1/04-probability.qmd
        - chapters/part1/05-inference.qmd
        - chapters/part1/06-linear-regression.qmd
        - chapters/part1/07-glm.qmd
        - chapters/part1/08-hierarchical-bayes.qmd
    - part: "Part II: Causal Inference and Estimands"
      chapters:
        - chapters/part2/09-potential-outcomes.qmd
        - chapters/part2/10-adjustment-methods.qmd
        - chapters/part2/11-effect-modification-collapsibility.qmd
        - chapters/part2/12-transportability.qmd
    - part: "Part III: Meta-Analysis and Network Meta-Analysis"
      chapters:
        - chapters/part3/13-pairwise-meta-analysis.qmd
        - chapters/part3/14-bucher.qmd
        - chapters/part3/15-network-meta-analysis.qmd
        - chapters/part3/16-limits-of-nma.qmd
    - part: "Part IV: Population Adjustment: MAIC and STC"
      chapters:
        - chapters/part4/17-population-adjustment-theory.qmd
        - chapters/part4/18-maic.qmd
        - chapters/part4/19-stc.qmd
    - part: "Part V: Multilevel Network Meta-Regression"
      chapters:
        - chapters/part5/20-mlnmr-aggregation.qmd
        - chapters/part5/21-mlnmr-discrete.qmd
        - chapters/part5/22-mlnmr-integration.qmd
        - chapters/part5/23-mlnmr-estimands.qmd
        - chapters/part5/24-computation.qmd
        - chapters/part5/25-general-likelihoods.qmd
        - chapters/part5/26-ml-umr.qmd
    - part: "Part VI: Bias, Comparator Selection, and Rigor"
      chapters:
        - chapters/part6/27-distance-matching.qmd
        - chapters/part6/28-qba.qmd
        - chapters/part6/29-simulation.qmd
        - chapters/part6/30-coq.qmd
  appendices:
    - appendices/A-notation-glossary.qmd
    - appendices/B-matrix-calculus.qmd
    - appendices/C-distributions.qmd
    - appendices/D-special-functions.qmd
    - appendices/E-reference-implementations.qmd
    - appendices/F-solutions.qmd
    - appendices/G-reading-coq.qmd
    - references.qmd

bibliography: references.bib

crossref:
  thm-title: "Theorem"
  lem-title: "Lemma"
  cor-title: "Corollary"
  prp-title: "Proposition"
  def-title: "Definition"
  exm-title: "Example"
  exr-title: "Exercise"

format:
  html:
    theme:
      - cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    html-math-method: mathjax
    code-copy: true
    callout-appearance: simple
  pdf:
    pdf-engine: pdflatex
    documentclass: scrbook
    classoption:
      - oneside
    papersize: letter
    fontsize: 11pt
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    keep-tex: true
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb,amsthm,mathtools}
